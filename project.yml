name: Bullarr
options:
  bundleIdPrefix: io.github.gwenvador
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.10"
    CURRENT_PROJECT_VERSION: "9"
    DEVELOPMENT_TEAM: K2BTBRRW3R
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  Bullarr:
    type: application
    platform: iOS
    sources:
      - Bullarr
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.gwenvador.bullarr
        PRODUCT_NAME: Bullarr
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_STRICT_CONCURRENCY: minimal
    info:
      path: Bullarr/Info.plist
      properties:
        CFBundleDisplayName: Bullarr
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        CFBundleURLTypes:
          - CFBundleURLName: io.github.gwenvador.bullarr.auth
            CFBundleURLSchemes:
              - bullarr
        ITSAppUsesNonExemptEncryption: false
